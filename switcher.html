<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Tab Switcher</title>
    <link rel="stylesheet" href="switcher.css">
  </head>
  <body>
    <main class="switcher" aria-label="Tab switcher">
      <header class="topbar">
        <div class="heading">
          <span class="mark" aria-hidden="true"><i></i><i></i><i></i></span>
          <h1>Your tabs</h1>
          <span class="count" id="tabCount">0</span>
        </div>
        <div class="hint"><kbd>↑</kbd><kbd>↓</kbd><kbd>←</kbd><kbd>→</kbd> navigate <span class="divider"></span> <kbd>↵</kbd> switch <span class="divider"></span> <kbd>esc</kbd> close</div>
        <button class="dismiss" id="dismiss" type="button" aria-label="Close tab switcher">×</button>
      </header>
      <section id="tabs" class="tab-grid" aria-live="polite"></section>
      <div id="empty" class="empty" hidden>No tabs are available in this window.</div>
    </main>
    <script src="switcher.js"></script>
  </body>
</html>
