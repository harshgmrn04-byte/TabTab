<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Tab Switcher settings</title>
    <link rel="stylesheet" href="options.css">
  </head>
  <body>
    <main>
      <div class="eyebrow">TAB SWITCHER</div>
      <h1>Keyboard shortcut</h1>
      <p>Use your preferred shortcut to open the visual tab switcher.</p>
      <section>
        <div>
          <strong id="shortcut">Loading…</strong>
          <span>Current shortcut</span>
        </div>
        <button id="change">Change shortcut</button>
      </section>
      <p class="note">
        Chrome keeps global shortcuts in its own shortcut manager. Select
        <b>Change shortcut</b>, then click the shortcut field next to Tab Switcher
        and press your preferred key combination.
      </p>
    </main>
    <script src="options.js"></script>
  </body>
</html>
